<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Graviton Gauntlet (#GGG)</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --text-muted: #8b949e;
            --accent-color: #58a6ff;
            --accent-hover: #1f6feb;
            --success-color: #238636;
            --danger-color: #da3633;
            --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            font-family: var(--font-stack);
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            line-height: 1.5;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }
        h1 { margin: 0 0 10px 0; color: #ffffff; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; gap: 20px; }
        .panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
        }
        button {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { opacity: 0.9; }
        input, select, textarea {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }
        th { background-color: var(--border-color); }
    </style>
</head>
<body>
    <header>
        <h1>Global Graviton Gauntlet (#GGG)</h1>
        <p>Local-First AI Testing, Benchmarking & Cognitive Task Harness (v1.2.2)</p>
    </header>
    <div class="container">
        <div class="panel">
            <h2>Harness Control Panel</h2>
            <label for="provider">Provider Preset:</label>
            <select id="provider">
                <option value="ollama">Ollama (Local)</option>
                <option value="openai">OpenAI-Compatible</option>
            </select>

            <label for="endpoint">Endpoint URL:</label>
            <input type="text" id="endpoint" value="http://localhost:11434/v1/chat/completions">

            <label for="model">Model Identifier:</label>
            <input type="text" id="model" value="llama3">

            <label for="prompt">Test Prompt / Task:</label>
            <textarea id="prompt" rows="4">Explain the concept of local-first software architecture in three concise bullet points.</textarea>

            <button id="run-btn">Run Gauntlet Benchmark</button>
        </div>

        <div class="panel">
            <h2>Live Console Output</h2>
            <pre id="output" style="background: var(--bg-color); padding: 10px; border: 1px solid var(--border-color); border-radius: 4px; min-height: 100px; white-space: pre-wrap;">Ready to benchmark...</pre>
        </div>

        <div class="panel">
            <h2>Model Leaderboard</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div>
                    <label>Weight Preset:</label>
                    <select id="weight-preset">
                        <option value="balanced">Balanced</option>
                        <option value="reliability">Reliability-first</option>
                        <option value="speed">Speed-first</option>
                    </select>
                </div>
            </div>
            <table id="leaderboard-table">
                <thead>
                    <tr>
                        <th>Model</th>
                        <th>Runs</th>
                        <th>Avg Latency (s)</th>
                        <th>Composite Score</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No benchmark runs recorded yet.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // v1.2.2 Core Logic Stub
        document.getElementById('run-btn').addEventListener('click', () => {
            const output = document.getElementById('output');
            output.textContent = "Executing run simulation against local endpoint...\nSuccess! Latency: 0.42s. Score assigned.";
        });
    </script>
</body>
</html>
